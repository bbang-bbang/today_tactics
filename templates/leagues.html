<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>해외리그 통계 — Today Tactics</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <link rel="stylesheet" href="/static/css/style.css?v=89">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        /* ── leagues.html 전용 레이아웃 ── */
        body { background: #0a0f1a; color: #c9d8ec; font-family: 'Pretendard', sans-serif; margin: 0; min-height: 100vh; }

        .lp-header {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 24px;
            background: #0d1525;
            border-bottom: 1px solid #1e2a3a;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .lp-back {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #60a5fa;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            padding: 5px 12px;
            border: 1px solid #1e3a5f;
            border-radius: 6px;
            transition: all 0.15s ease;
        }
        .lp-back:hover { background: #1e3a5f; color: #93c5fd; }
        .lp-title {
            font-size: 18px;
            font-weight: 700;
            color: #e2eaf5;
            margin: 0;
            flex: 1;
        }
        .lp-title span { color: #60a5fa; }
        .lp-user {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #7a8ba8;
        }
        .lp-user a { color: #7a8ba8; text-decoration: none; font-size: 12px; }
        .lp-user a:hover { color: #93c5fd; }
        .lp-avatar {
            width: 28px; height: 28px; border-radius: 50%;
            object-fit: cover; border: 1px solid #1e3a5f;
        }

        .lp-body {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px 24px 60px;
        }

        /* 리그 선택 칩 */
        .lp-league-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .lp-league-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            border-radius: 24px;
            border: 1px solid #1e2a3a;
            background: #111827;
            color: #7a8ba8;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .lp-league-chip:hover { border-color: #3b82f6; color: #93c5fd; }
        .lp-league-chip.active {
            background: #1e3a5f;
            border-color: #3b82f6;
            color: #e2eaf5;
            font-weight: 700;
        }
        .lp-league-chip .lp-flag { font-size: 16px; line-height: 1; }

        /* 컨트롤 바 (시즌 + 섹션) */
        .lp-control-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .lp-section-tabs {
            display: flex;
            gap: 4px;
            background: #111827;
            border: 1px solid #1e2a3a;
            border-radius: 8px;
            padding: 4px;
            flex: 1;
        }
        .lp-sec-btn {
            flex: 1;
            padding: 7px 16px;
            border-radius: 6px;
            border: none;
            background: transparent;
            color: #7a8ba8;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }
        .lp-sec-btn:hover { color: #93c5fd; }
        .lp-sec-btn.active { background: #1e3a5f; color: #e2eaf5; font-weight: 700; }

        .lp-year-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .lp-year-label { font-size: 12px; color: #7a8ba8; }
        .lp-year-select {
            background: #111827;
            border: 1px solid #1e2a3a;
            color: #c9d8ec;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 13px;
            cursor: pointer;
        }
        .lp-year-select:focus { outline: none; border-color: #3b82f6; }

        /* 콘텐츠 영역 */
        .lp-content {
            min-height: 300px;
            background: #0d1525;
            border: 1px solid #1e2a3a;
            border-radius: 10px;
            padding: 20px;
        }
        .lp-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            color: #7a8ba8;
            font-size: 14px;
        }
        .lp-empty {
            text-align: center;
            padding: 40px 20px;
            color: #7a8ba8;
        }
        .lp-empty p { margin: 6px 0; }
        .lp-empty-sub { font-size: 12px; opacity: 0.7; }
        .lp-empty code {
            display: inline-block;
            margin-top: 8px;
            background: #111827;
            border: 1px solid #1e2a3a;
            border-radius: 4px;
            padding: 4px 10px;
            font-size: 11px;
            color: #60a5fa;
        }
        .lp-error {
            text-align: center;
            padding: 40px 20px;
            color: #f87171;
            font-size: 14px;
        }

        /* 리그 제목 행 */
        .lp-league-heading {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #1e2a3a;
        }
        .lp-league-flag { font-size: 22px; }
        .lp-league-name { font-size: 17px; font-weight: 700; color: #e2eaf5; }
        .lp-league-season { font-size: 12px; color: #7a8ba8; margin-left: auto; }

        /* 테이블 공통 — gl-table 재사용 */

        /* 데이터 없음 안내 (리그 지원 미수집) */
        .lp-no-player-note {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 12px;
            padding: 5px 12px;
            background: #1a1f2e;
            border: 1px solid #2a3a5a;
            border-radius: 6px;
            font-size: 12px;
            color: #f59e0b;
        }

        /* ── 리그 분석 탭 ── */
        .lp-analysis { display: flex; flex-direction: column; gap: 28px; }

        /* 하이라이트 카드 6개 */
        .lp-hl-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .lp-hl-card {
            background: #111827;
            border: 1px solid #1e2a3a;
            border-radius: 10px;
            padding: 14px 16px;
            transition: border-color 0.15s ease;
        }
        .lp-hl-card:hover { border-color: #334155; }
        .lp-hl-label {
            font-size: 11px;
            color: #7a8ba8;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }
        .lp-hl-name {
            font-size: 15px;
            font-weight: 700;
            color: #e2eaf5;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .lp-hl-team {
            font-size: 12px;
            color: #7a8ba8;
            margin-bottom: 10px;
        }
        .lp-hl-val {
            font-size: 26px;
            font-weight: 800;
            color: #60a5fa;
            line-height: 1;
        }
        .lp-hl-unit {
            font-size: 12px;
            color: #7a8ba8;
            margin-left: 4px;
            font-weight: 400;
        }

        /* Scatter 차트 */
        .lp-chart-section { }
        .lp-chart-title {
            font-size: 14px;
            font-weight: 600;
            color: #c9d8ec;
            margin-bottom: 12px;
        }
        .lp-chart-title span { color: #7a8ba8; font-size: 12px; font-weight: 400; margin-left: 8px; }
        .lp-chart-box {
            background: #111827;
            border: 1px solid #1e2a3a;
            border-radius: 10px;
            padding: 20px;
            position: relative;
            height: 340px;
        }
        .lp-chart-legend {
            display: flex;
            gap: 16px;
            margin-top: 10px;
            font-size: 11px;
            color: #7a8ba8;
        }
        .lp-legend-dot {
            display: inline-block;
            width: 8px; height: 8px;
            border-radius: 50%;
            margin-right: 4px;
            vertical-align: middle;
        }

        /* 포지션별 랭킹 */
        .lp-pos-section { }
        .lp-pos-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }
        .lp-pos-btn {
            padding: 5px 14px;
            border-radius: 6px;
            border: 1px solid #1e2a3a;
            background: transparent;
            color: #7a8ba8;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .lp-pos-btn:hover { border-color: #3b82f6; color: #93c5fd; }
        .lp-pos-btn.active { background: #1e3a5f; border-color: #3b82f6; color: #e2eaf5; font-weight: 600; }
    </style>
</head>
<body>

<header class="lp-header">
    <a href="/" class="lp-back">← 전술판</a>
    <h1 class="lp-title"><span>🌍</span> 해외리그 통계</h1>
    {% if current_user %}
    <div class="lp-user">
        {% if current_user.picture %}
        <img class="lp-avatar" src="{{ current_user.picture }}" alt="" referrerpolicy="no-referrer">
        {% endif %}
        <span>{{ current_user.name }}</span>
        <a href="/auth/logout">로그아웃</a>
    </div>
    {% endif %}
</header>

<div class="lp-body">
    <div class="lp-league-bar" id="lp-league-bar">
        <div class="lp-loading">리그 목록 로딩 중…</div>
    </div>

    <div class="lp-control-bar">
        <div class="lp-section-tabs" id="lp-section-tabs">
            <button class="lp-sec-btn active" data-sec="standings">📋 순위표</button>
            <button class="lp-sec-btn" data-sec="team-rankings">📊 팀 지표</button>
            <button class="lp-sec-btn" data-sec="top-performers">⭐ TOP 퍼포머</button>
            <button class="lp-sec-btn" data-sec="analysis">🔬 리그 분석</button>
        </div>
        <div class="lp-year-wrap">
            <span class="lp-year-label">시즌</span>
            <select id="lp-year" class="lp-year-select">
                <option value="2025">2025/26</option>
                <option value="2024">2024/25</option>
                <option value="2023">2023/24</option>
            </select>
        </div>
    </div>

    <div class="lp-content" id="lp-content">
        <div class="lp-loading">로딩 중…</div>
    </div>
</div>

<script src="/static/js/leagues.js?v=1"></script>
</body>
</html>
